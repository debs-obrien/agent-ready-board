name: app-sdk

on:
  push:
    paths:
      - "app-sdk/**"
      - ".github/workflows/app-sdk.yml"
  pull_request:
    paths:
      - "app-sdk/**"
      - ".github/workflows/app-sdk.yml"

defaults:
  run:
    working-directory: app-sdk

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-sdk/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
